[package]
name = "setu-timing"
version.workspace = true
edition.workspace = true

# Observability side-channel for M0 pipeline profiling (docs/feat/m0-pipeline-baseline/).
# Pure leaf: zero internal setu-* deps (so storage/consensus/validator/enclave can
# depend on it safely).

[features]
# OFF by default — production builds get zero-cost no-ops, zero external deps, zero G1 risk.
# Consuming crates opt in via their own feature `m0-profiling = ["setu-timing/enabled"]`.
default = []
enabled = ["dep:serde", "dep:serde_json"]

[dependencies]
serde = { workspace = true, optional = true }
serde_json = { version = "1.0", optional = true }
