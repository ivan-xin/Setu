[package]
name = "consensus"
version.workspace = true
edition.workspace = true

[features]
# async-broadcast promoted to default (M0-report §10: single-target A/B ×4.2 — 94→398
# TPS, 100% success, submit_broadcast 111ms→4.5µs, validated FDP+REP+TDD). Opt back to
# synchronous broadcast via `--no-default-features` (revert path). NOTE: the multi-host
# "348→972" scaling claim (§11) was retracted (§11b) — confounded by benchmark account
# funding; the single-target A/B is the reliable evidence. See docs/feat/async-event-broadcast/.
default = ["async-broadcast"]
# Phase 1 diagnostic instrumentation for consensus-root-self-consistency FDP.
# Adds DIAG probes to commit_build / apply_follower_finalized_cf /
# compute_state_root_from_events. Default OFF — zero overhead, zero behavior change.
# See docs/feat/consensus-root-self-consistency/design.md §3.6.
diag-root-drift = []
# M0 pipeline profiling (docs/feat/m0-pipeline-baseline/). Flips setu-timing into
# its real impl; default OFF — probe calls compile to zero-cost no-ops.
m0-profiling = ["setu-timing/enabled"]
# M1 finalized-throughput profiling (docs/feat/m1-finalized-throughput/). Adds CF-size/
# fold-cadence (folder.rs) + cold-parent (dag_manager.rs) probes. Default OFF — zero-cost.
m1-profiling = ["setu-timing/enabled"]
# M0-driven optimization (M0-report §9): per-event P2P broadcast goes through a bounded
# FIFO worker (off the submit critical path) instead of a synchronous await (~94% of submit
# cost). Broadcast is best-effort (state sync fills gaps). Now ON by default (see `default`).
async-broadcast = []

[dependencies]
setu-types = { path = "../types" }
setu-vlc = { path = "../crates/setu-vlc" }
setu-timing = { path = "../crates/setu-timing" }
setu-merkle = { path = "../crates/setu-merkle" }
setu-storage = { path = "../storage" }
blake3 = "1.5"
hex = "0.4"
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros"] }
parking_lot = "0.12"
thiserror = "1.0"
async-trait = "0.1"
tracing = "0.1"
lru = "0.12"

[dev-dependencies]
setu-types = { path = "../types", features = ["test-utils"] }
tokio = { version = "1", features = ["full", "test-util"] }
